
name: Diagnose TCL C7L

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect product and history
        run: |
          python - <<'PY'
          import json
          import urllib.request

          product_id = "mercadolivre-MLB74127412"
          base = "https://farejapreco.com.br/api/v1/produtos/"

          urls = {
              "PRODUTO": base + product_id,
              "HISTORICO": base + product_id + "/historico?dias=30"
          }

          for name, url in urls.items():
              print("\n===== " + name + " =====")
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "TV-Radar-65/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      print("HTTP:", response.status)
                      data = json.load(response)

                  print(json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2
                  )[:12000])

              except Exception as e:
                  print("ERRO:", type(e).__name__, str(e))
          PY

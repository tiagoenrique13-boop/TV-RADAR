
name: Testar cobertura Pechincha.ai - TV Radar
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar e filtrar TVs de 65 polegadas
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          URL = "https://pechincha.ai/mcp"
          HEADERS = {
              "Content-Type": "application/json",
              "Accept": "application/json, text/event-stream",
              "User-Agent": "TV-Radar-65/1.1"
          }

          def call(payload, sid=None):
              headers = dict(HEADERS)
              if sid:
                  headers["Mcp-Session-Id"] = sid

              req = urllib.request.Request(
                  URL,
                  data=json.dumps(payload).encode(),
                  headers=headers,
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=45) as r:
                  body = r.read().decode()
                  sid = r.headers.get("Mcp-Session-Id") or sid
                  content_type = r.headers.get("Content-Type", "")

              if "text/event-stream" in content_type:
                  values = []
                  for line in body.splitlines():
                      if line.startswith("data:"):
                          try:
                              values.append(json.loads(line[5:].strip()))
                          except json.JSONDecodeError:
                              pass
                  return (values[-1] if values else {}), sid

              return (json.loads(body) if body else {}), sid

          init, sid = call({
              "jsonrpc": "2.0",
              "id": 1,
              "method": "initialize",
              "params": {
                  "protocolVersion": "2025-11-25",
                  "capabilities": {},
                  "clientInfo": {
                      "name": "TV-Radar-65",
                      "version": "1.1"
                  }
              }
          })

          if init.get("error"):
              raise RuntimeError(json.dumps(init["error"]))

          call({
              "jsonrpc": "2.0",
              "method": "notifications/initialized",
              "params": {}
          }, sid)

          queries = [
              "TV TCL Mini LED",
              "TV OLED LG",
              "TV OLED Samsung",
              "TV Mini LED Hisense",
              "TCL C6K",
              "televisão 65 polegadas"
          ]

          # Modelos de referência e tecnologias que queremos investigar.
          model_terms = [
              "C7L", "C7K", "C6K",
              "OLED65B5", "OLED65C5", "OLED65C6",
              "S90", "S95", "QN90", "QN95",
              "U8"
          ]

          all_deals = {}
          request_id = 2

          for query in queries:
              print("\n" + "=" * 65)
              print("BUSCA:", query)

              page = 1
              total_pages = 1
              total_found = 0

              while page <= total_pages:
                  try:
                      data, sid = call({
                          "jsonrpc": "2.0",
                          "id": request_id,
                          "method": "tools/call",
                          "params": {
                              "name": "search_deals",
                              "arguments": {
                                  "query": query,
                                  "limit": 25,
                                  "page": page
                              }
                          }
                      }, sid)

                      request_id += 1
                      result = data.get("result", data)
                      structured = result.get("structuredContent", {})

                      if not structured:
                          print("Resposta sem structuredContent:")
                          print(json.dumps(result, ensure_ascii=False)[:3000])
                          break

                      deals = structured.get("deals", [])
                      total_pages = structured.get("pages", 1)
                      total_found = structured.get("total", 0)

                      print(
                          f"Página {page}/{total_pages} | "
                          f"Ofertas encontradas: {total_found}"
                      )

                      for deal in deals:
                          title = str(
                              deal.get("title")
                              or deal.get("name")
                              or deal.get("product_name")
                              or ""
                          )

                          normalized = title.upper()
                          has_65 = bool(
                              re.search(r'(?<!\d)65\s*(?:\"|”|POL|POLEGADAS)?',
                                        normalized)
                          )

                          if not has_65:
                              continue

                          # Excluir monitores, acessórios e resultados
                          # que não pareçam televisores.
                          excluded = [
                              "MONITOR", "CONTROLE REMOTO",
                              "SUPORTE", "CABO", "CAPA"
                          ]

                          if any(x in normalized for x in excluded):
                              continue

                          deal_id = (
                              deal.get("id")
                              or deal.get("url")
                              or title
                          )

                          all_deals[deal_id] = deal

                  except Exception as e:
                      print(f"Erro na página {page}: {e}")
                      break

                  page += 1

          print("\n" + "=" * 65)
          print("RESULTADO CONSOLIDADO")
          print("Ofertas únicas de TVs de 65 polegadas:", len(all_deals))

          for deal in all_deals.values():
              title = str(
                  deal.get("title")
                  or deal.get("name")
                  or deal.get("product_name")
                  or "Título não identificado"
              )

              normalized = title.upper()
              matched = [
                  model for model in model_terms
                  if model in normalized
              ]

              print("\n--------------------------------")
              print("PRODUTO:", title)
              print("MODELOS IDENTIFICADOS:", matched or "Validar manualmente")
              print("PREÇO:", deal.get("price"))
              print("LOJA:", deal.get("store"))
              print("PUBLICAÇÃO:", deal.get("published_at") or deal.get("published_date"))
              print("LINK:", deal.get("url"))
              print("ID:", deal.get("id"))

          print("\nFim do teste. Preços precisam ser confirmados na loja.")
          PY
